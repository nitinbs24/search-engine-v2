syntax = "proto3";

package search;

option go_package = "search-engine-v2/backend/proto";

// The search worker turns a natural-language query into what the backend needs
// to build the OpenSearch query. It never talks to OpenSearch itself.
service SearchWorker {
  rpc ParseQuery(ParseQueryRequest) returns (ParseQueryResponse);
  // One relevance score per passage, in input order; higher is more relevant.
  rpc Rerank(RerankRequest) returns (RerankResponse);
  // A short answer, citing filenames, written from the given passages. UNAVAILABLE when the
  // answer model is not running (it is optional).
  rpc Answer(AnswerRequest) returns (AnswerResponse);
}

message ParseQueryRequest {
  string query = 1;
}

message ParseQueryResponse {
  repeated string keywords = 1;   // for the BM25 leg
  Filters filters = 2;
  repeated float text_vector = 3; // for the kNN leg on text_embedding
  repeated float image_vector = 4; // for the kNN leg on image_embedding
  string clean_query = 5;          // the query without filter phrases: what was embedded, and what to rerank against
}

message RerankRequest {
  string query = 1;
  repeated string passages = 2;
  int32 highlight_top = 3; // also pick the best sentence of this many top-scoring passages
}

message RerankResponse {
  repeated float scores = 1;
  repeated string highlights = 2; // per passage: its best sentence, "" where none was picked
}

message AnswerRequest {
  string query = 1;
  repeated Source sources = 2;
}

message Source {
  string filename = 1;
  string passage = 2;
}

message AnswerResponse {
  string answer = 1;
}

// Unset fields (empty list, 0, "") mean "no restriction".
message Filters {
  // A file matches if it has any of these extensions or MIME prefixes.
  repeated string extensions = 1;
  repeated string mime_prefixes = 2;
  int64 min_size_bytes = 3;
  int64 max_size_bytes = 4;
  // ISO-8601 with offset; uploaded_from <= uploaded_at < uploaded_to.
  string uploaded_from = 5;
  string uploaded_to = 6;
}
